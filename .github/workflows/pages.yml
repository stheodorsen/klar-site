name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The page's claims are asserted rather than trusted: one ABV everywhere,
      # only the two public keg prices, an accessible form, and placeholders
      # that block the deploy the moment noindex comes off.
      - name: Check copy, prices and form
        run: node site/tools/check-site.mjs

      # Content-hash the CSS and JS URLs so a deploy cannot be served from a
      # stale browser cache. Done here, not in the repo, so index.html stays
      # clean in git.
      - name: Stamp asset URLs
        run: node site/tools/stamp-assets.mjs

      - uses: actions/configure-pages@v5
      # the site is static: no build step, publish site/ as-is
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
