<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.85 -7.15 66.3 66.3">
  <style>
    .mark-circle { stroke: #26231F; stroke-width: 3.09; }
    .mark-horizon { stroke: #26231F; stroke-width: 3; }
    @media (prefers-color-scheme: dark) {
      /* reversed artwork carries its own compensation, per the brief:
         thin strokes optically thin further light-on-dark */
      .mark-circle { stroke: #FDFCF7; stroke-width: 3.18; }
      .mark-horizon { stroke: #FDFCF7; stroke-width: 3.09; }
    }
  </style>
  <circle class="mark-circle" cx="50" cy="26" r="18" fill="none"/>
  <line class="mark-horizon" x1="23" y1="35" x2="77" y2="35" stroke-linecap="round"/>
</svg>
